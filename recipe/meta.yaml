{% set name = "trame-client" %}
{% set version = "3.13.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1ba7d1528ad082195c03b29c876db07817da741e2c9a50a32914534b24f31332

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - trame-common >=0.2.0

test:
  imports:
    - trame
    - trame_client
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Kitware/trame-client
  summary: Internal client of trame
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
  dev_url: https://github.com/Kitware/trame-client
  doc_url: https://github.com/Kitware/trame-client/blob/master/README.rst
  

extra:
  recipe-maintainers:
    - larsoner
    - jourdain
    - psavery
    - kwrobot
