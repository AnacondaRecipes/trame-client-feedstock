{% set name = "trame-client" %}
{% set version = "3.12.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a9bfba0226dda4a2ff36805ebf12e649cd7eb94c40672c8495d0674a12d5d381

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - trame-common >=0.2.0

test:
  imports:
    - trame
    - trame_client
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Kitware/trame-client
  summary: Internal client of trame
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
  dev_url: https://github.com/Kitware/trame-client
  doc_url: https://github.com/Kitware/trame-client/blob/master/README.rst
  

extra:
  recipe-maintainers:
    - larsoner
    - jourdain
    - psavery
    - kwrobot
